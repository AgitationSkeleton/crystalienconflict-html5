<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrystAlien Conflict</title>
<meta name="description" content="CrystAlien Conflict, the 2007 LEGO real-time strategy game by 4T2 Multimedia, running in the browser without Flash.">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
  noscript, .failed { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 0 16px;
    color: #ccc; font: 16px sans-serif; text-align: center; }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="CrystAlien Conflict"></canvas>
<noscript>CrystAlien Conflict needs JavaScript to run.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
