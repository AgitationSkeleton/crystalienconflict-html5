<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Reference: the original SWFs in Ruffle</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #holder, ruffle-player, ruffle-embed { display: block; width: 100vw; height: 100vh; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, letterbox: 'on',
    backgroundColor: '#000000', contextMenu: 'off', warnOnUnsupportedContent: false,
    openUrlMode: 'deny', logLevel: 'warn', quality: 'high', allowFullscreen: true,
  };
</script>
<script src="../ruffle/ruffle.js"></script>
</head>
<body>
<div id="holder"></div>
<script>
  window.addEventListener('load', () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.getElementById('holder').appendChild(player);
    window.rplayer = player;
    // Exactly what Launcher.html embedded.
    player.ruffle().load({ url: 'loader.swf?xmlurl=dialogue.xml&asseturl=&serviceurl=&gamename=CrystAlienConflict' });
  });
</script>
</body>
</html>
